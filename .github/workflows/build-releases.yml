name: Build container release images (Stromer)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: Dockerfile
      push_to_images: |
        ghcr.io/${{ github.repository_owner }}/stromer
      # Do not use cache when building releases, so apt update is always ran and the release always contain the latest packages
      cache: false
      # A tag such as v0.1.0 gives the images v0.1.0 and v0.1, and moves `latest` for a non-prerelease tag.
      flavor: |
        latest=auto
      tags: |
        type=semver,pattern=v{{version}}
        type=semver,pattern=v{{major}}.{{minor}}
    secrets: inherit

  build-image-streaming:
    uses: ./.github/workflows/build-container-image.yml
    with:
      file_to_build: streaming/Dockerfile
      push_to_images: |
        ghcr.io/${{ github.repository_owner }}/stromer-streaming
      cache: false
      flavor: |
        latest=auto
      tags: |
        type=semver,pattern=v{{version}}
        type=semver,pattern=v{{major}}.{{minor}}
    secrets: inherit
